[project]
name = "trustguard-risk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "scikit-learn==1.9.1",
  "networkx==3.7",
  "cryptography==50.0.2",
  "pydantic==2.14.3"
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
